<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Medic Service — Display sala d'attesa (verticale)</title>
<link rel="icon" href="/assets/monogram.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;500&family=DM+Serif+Display&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<!--
  Display TV per la sala d'attesa — VERSIONE VERTICALE (schermo 9:16, es. 1080×1920).
  Stessi contenuti e stessi dati della versione orizzontale (/display/), letti da /display/data.js.

  La pagina è disegnata su una tela fissa 1080×1920 che si adatta allo schermo.

  Parametri URL (facoltativi):
    ?t=25        secondi per schermata (default 22)
    ?ogni=4      una schermata servizio ogni N medici (0 = solo medici)
    ?mescola=1   ordine casuale dei medici a ogni giro
    ?da=cadeddu  parte dal medico indicato
    ?ruota=90    ruota la pagina di 90° (oppure -90) se la TV è montata in verticale
                 ma il lettore/browser continua a mandare l'immagine in orizzontale

  Tasti: ← → per scorrere, spazio per pausa, F per schermo intero.
-->
<style>
  :root {
    --navy: #0E334F;
    --brand: #2D99DA;
    --brand-dk: #1F7FBC;
    --blue-pale: #C9E2F4;
    --oak: #C7AA80;
    --g700: #5C5E62;
    --g500: #939599;
    --g150: #E4E5E7;
    --g075: #F3F4F5;
    --paper: #FFFFFF;
    --sans: "Montserrat", system-ui, "Segoe UI", sans-serif;
    --display: "DM Serif Display", Georgia, serif;
    --num: "Chivo Mono", ui-monospace, monospace;
    --fade: 900ms;
    --head: 150px;    /* fascia logo + orologio */
    --photo: 760px;   /* altezza area foto */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--navy);
    color: var(--navy);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    cursor: none;
  }
  svg { display: block; }

  /* ---------- tela fissa 1080×1920, scalata via JS ---------- */
  .canvas {
    position: absolute; left: 0; top: 0;
    width: 1080px; height: 1920px;
    transform-origin: 0 0;
    background: var(--paper);
    overflow: hidden;
  }
  .stage { position: absolute; left: 0; right: 0; top: var(--head); bottom: 0; }
  .slide {
    position: absolute; inset: 0;
    display: grid; grid-template-rows: var(--photo) 1fr;
    opacity: 0; transition: opacity var(--fade) ease;
    background: var(--paper);
  }
  .slide.is-on { opacity: 1; }

  /* ---------- area immagine ---------- */
  .media { position: relative; overflow: hidden; background: var(--navy); }
  .media img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 18%;
    transform: scale(1.04); transition: transform 24s linear;
  }
  .slide.is-on .media img { transform: scale(1); }
  .media::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 26%; z-index: 1;
    background: linear-gradient(180deg, rgba(14,51,79,.45), rgba(14,51,79,0));
  }
  .media__badge {
    position: absolute; left: 64px; top: 44px; z-index: 1;
    color: #fff; font-weight: 800; font-size: 20px; letter-spacing: .22em; text-transform: uppercase;
  }
  .media__badge::before {
    content: ""; display: inline-block; width: 48px; height: 4px; background: var(--brand);
    vertical-align: middle; margin-right: 16px;
  }
  .media--mark { display: flex; align-items: center; justify-content: center; }
  .media--mark .mark-bg {
    position: absolute; right: -140px; bottom: -120px; width: 760px; opacity: .05;
  }
  .media--mark .initials {
    position: relative; z-index: 1;
    width: 380px; height: 380px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,.25);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--display); font-size: 156px; color: #fff; letter-spacing: .02em;
  }
  .media--mark .service-icon {
    position: relative; z-index: 1;
    width: 400px; height: 400px; border-radius: 50%;
    background: rgba(45,153,218,.16); border: 4px solid rgba(45,153,218,.45);
    display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .media--mark .service-icon svg { width: 176px; height: 176px; }

  /* ---------- area testo ---------- */
  .body {
    position: relative;
    display: flex; flex-direction: column;
    padding: 52px 64px 112px;
  }
  .eyebrow {
    font-weight: 800; font-size: 21px; letter-spacing: .22em; text-transform: uppercase; color: var(--brand);
  }
  .name {
    font-family: var(--display); font-weight: 400;
    font-size: 78px; line-height: 1.04; letter-spacing: -.01em;
    margin: 14px 0 0;
  }
  .name.is-long { font-size: 66px; }
  .specs {
    margin-top: 14px; font-size: 31px; font-weight: 700; color: var(--brand-dk); line-height: 1.25;
  }
  .lead { margin-top: 20px; font-size: 28px; line-height: 1.45; color: var(--g700); font-weight: 500; }

  .prest-block { margin-top: 28px; }
  .prest { margin: 0; padding: 0; list-style: none; }
  .prest__title {
    font-size: 18px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--g500);
    margin-bottom: 12px;
  }
  .prest li {
    display: flex; align-items: flex-start;
    font-size: 28px; font-weight: 600; line-height: 1.3; color: var(--navy);
    padding: 8px 0; border-top: 2px solid var(--g150);
  }
  .prest li:last-child { border-bottom: 2px solid var(--g150); }
  .prest li svg { flex: none; width: 28px; height: 28px; color: var(--brand); margin: 3px 16px 0 0; }

  /* ---------- blocco QR ---------- */
  .book {
    margin-top: auto;
    display: flex; align-items: center;
    background: var(--g075); border-radius: 22px;
    padding: 20px 36px 20px 20px;
  }
  .qr {
    flex: none; width: 300px; height: 300px; padding: 16px;
    background: #fff; border-radius: 16px;
    box-shadow: 0 14px 34px -22px rgba(14,51,79,.45);
  }
  .qr svg { width: 100%; height: 100%; fill: var(--navy); }
  .book__copy { margin-left: 40px; }
  .book__kicker {
    display: flex; align-items: center;
    font-size: 19px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--brand);
  }
  .book__kicker svg { width: 28px; height: 28px; margin-right: 12px; }
  .book__title { font-size: 42px; font-weight: 800; line-height: 1.12; margin-top: 14px; letter-spacing: -.01em; }
  .book__note { font-size: 23px; color: var(--g700); font-weight: 500; margin-top: 14px; line-height: 1.4; }
  .book__note b { font-family: var(--num); font-weight: 500; color: var(--navy); white-space: nowrap; }

  /* ---------- cornice fissa ---------- */
  .topbar {
    position: absolute; z-index: 5; top: 0; left: 0; right: 0; height: var(--head);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 64px; background: var(--paper);
  }
  .topbar img { height: 58px; width: auto; }
  .clock { text-align: right; }
  .clock__time { font-family: var(--num); font-size: 44px; font-weight: 500; line-height: 1; }
  .clock__date { font-size: 18px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--g500); margin-top: 10px; }

  .general {
    position: absolute; z-index: 5; right: 40px; top: calc(var(--head) + var(--photo) - 40px);
    transform: translateY(-100%);
    box-shadow: 0 16px 44px -22px rgba(0,0,0,.5);
    display: flex; align-items: center;
    background: var(--navy); color: #fff; border-radius: 16px; padding: 14px 14px 14px 24px;
  }
  .general__txt { font-size: 18px; font-weight: 700; line-height: 1.3; margin-right: 16px; }
  .general__txt span { display: block; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--blue-pale); font-weight: 800; }
  .general .qr-mini { width: 124px; height: 124px; padding: 9px; background: #fff; border-radius: 10px; }
  .general .qr-mini svg { width: 100%; height: 100%; fill: var(--navy); }

  .foot {
    position: absolute; z-index: 5; left: 0; right: 0; bottom: 0;
    padding: 0 64px 42px; font-size: 21px; font-weight: 600; color: var(--g500);
    display: flex; align-items: center;
  }
  .foot svg { width: 24px; height: 24px; margin-right: 10px; color: var(--brand); }
  .foot span { display: inline-flex; align-items: center; margin-right: 36px; }
  .foot .num { font-family: var(--num); font-weight: 500; color: var(--navy); }

  .progress { position: absolute; z-index: 6; left: 0; right: 0; bottom: 0; height: 10px; background: rgba(14,51,79,.12); }
  .progress__bar {
    height: 100%; width: 100%; background: var(--brand);
    transform-origin: 0 50%; transform: scaleX(0);
  }
  .paused .progress__bar { background: var(--oak); }
</style>
</head>
<body>

<div class="canvas" id="canvas">
  <div class="stage" id="stage"></div>

  <div class="topbar">
    <img src="/assets/logo-horizontal.svg" alt="Medic Service">
    <div class="clock"><div class="clock__time" id="clockTime">--:--</div><div class="clock__date" id="clockDate"></div></div>
  </div>

  <div class="general">
    <div class="general__txt"><span>Tutte le agende</span>Prenota con<br>qualsiasi medico</div>
    <div class="qr-mini" id="generalQr"></div>
  </div>

  <div class="foot">
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>Piazza Tharros 57, Oristano</span>
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span class="num">0783 211136</span></span>
  </div>

  <div class="progress"><div class="progress__bar" id="bar"></div></div>
</div>

<script src="/display/data.js"></script>
<script>
(function () {
  "use strict";

  var params = new URLSearchParams(location.search);
  function num(key, def) { var v = parseFloat(params.get(key)); return isNaN(v) ? def : v; }

  var CONFIG = {
    seconds: num("t", 22),
    serviceEvery: num("ogni", 4),
    shuffle: params.get("mescola") === "1",
    rotate: num("ruota", 0),        // 0, 90 o -90
    reloadAfterHours: 4
  };

  /* ---------- adatta la tela 1080×1920 allo schermo ---------- */
  var canvas = document.getElementById("canvas");
  var W = 1080, H = 1920;
  function fit() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var rot = CONFIG.rotate === 90 || CONFIG.rotate === -90 || CONFIG.rotate === 270;
    var aw = rot ? vh : vw, ah = rot ? vw : vh;     // spazio disponibile per la tela
    var s = Math.min(aw / W, ah / H);
    var w = W * s, h = H * s;
    var tf;
    if (!rot) {
      tf = "translate(" + (vw - w) / 2 + "px," + (vh - h) / 2 + "px) scale(" + s + ")";
    } else if (CONFIG.rotate === 90) {
      tf = "translate(" + ((vw - h) / 2 + h) + "px," + (vh - w) / 2 + "px) rotate(90deg) scale(" + s + ")";
    } else {
      tf = "translate(" + (vw - h) / 2 + "px," + ((vh - w) / 2 + w) + "px) rotate(-90deg) scale(" + s + ")";
    }
    canvas.style.transform = tf;
  }
  window.addEventListener("resize", fit);
  fit();

  var DATA = window.DISPLAY_DATA;
  var stage = document.getElementById("stage");
  var bar = document.getElementById("bar");

  var ICONS = {
    check: '<path d="M20 6 9 17l-5-5"/>',
    phone: '<rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/>',
    scan: '<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/>',
    activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
    heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
    sparkles: '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>'
  };
  function icon(name) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name] || ICONS.check) + '</svg>';
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }
  function initials(name) {
    var parts = name.replace(/^(Dr\.ssa|Dr\.|Dott\.ssa|Dott\.|Op\.)\s+/i, "").split(/\s+/);
    return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
  }

  var MARK_BG = '<img class="mark-bg" src="/assets/monogram-white.svg" alt="">';

  function doctorHtml(d) {
    var media = d.hasPhoto
      ? '<div class="media"><img src="' + esc(d.photo) + '" alt=""><div class="media__badge">' + esc(d.area) + '</div></div>'
      : '<div class="media media--mark">' + MARK_BG + '<div class="initials">' + esc(initials(d.name)) + '</div><div class="media__badge">' + esc(d.area) + '</div></div>';
    var prest = d.prestazioni.slice(0, 4);
    var list = prest.length
      ? '<div class="prest-block"><div class="prest__title">Prestazioni</div><ul class="prest">' +
        prest.map(function (p) { return "<li>" + icon("check") + "<span>" + esc(p) + "</span></li>"; }).join("") +
        "</ul></div>"
      : "";
    var note = d.direct
      ? "Si apre la sua agenda: scegli giorno e orario."
      : "Per prenotare chiedi in accettazione o chiama lo <b>0783 211136</b>.";
    return media +
      '<div class="body">' +
        '<div class="eyebrow">Il nostro team</div>' +
        '<h1 class="name' + (d.name.length > 22 ? " is-long" : "") + '">' + esc(d.name) + "</h1>" +
        '<div class="specs">' + esc(d.specs.join(" · ")) + "</div>" +
        list +
        bookHtml(d.qr, d.direct ? "Prenota una visita" : "Scopri la sua scheda", note) +
      "</div>";
  }

  function serviceHtml(s) {
    return '<div class="media media--mark">' + MARK_BG +
        '<div class="service-icon">' + icon(s.icon) + '</div><div class="media__badge">' + esc(s.eyebrow) + "</div></div>" +
      '<div class="body">' +
        '<div class="eyebrow">I nostri servizi</div>' +
        '<h1 class="name' + (s.title.length > 22 ? " is-long" : "") + '">' + esc(s.title) + "</h1>" +
        '<p class="lead">' + esc(s.text) + "</p>" +
        '<div class="prest-block"><ul class="prest">' +
          s.items.map(function (p) { return "<li>" + icon("check") + "<span>" + esc(p) + "</span></li>"; }).join("") +
        "</ul></div>" +
        bookHtml(s.qr, "Prenota questo servizio", "Si apre la pagina di prenotazione: scegli giorno e orario.") +
      "</div>";
  }

  function bookHtml(qr, title, note) {
    return '<div class="book"><div class="qr">' + qr + "</div>" +
      '<div class="book__copy">' +
        '<div class="book__kicker">' + icon("phone") + "Inquadra con il telefono</div>" +
        '<div class="book__title">' + title + "</div>" +
        '<div class="book__note">' + note + "</div>" +
      "</div></div>";
  }

  /* ---------- sequenza ---------- */
  function shuffled(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  var serviceCursor = 0;
  function buildSequence() {
    var docs = CONFIG.shuffle ? shuffled(DATA.doctors) : DATA.doctors;
    var seq = [];
    docs.forEach(function (d, i) {
      seq.push({ kind: "doctor", item: d });
      if (CONFIG.serviceEvery > 0 && DATA.services.length && (i + 1) % CONFIG.serviceEvery === 0) {
        seq.push({ kind: "service", item: DATA.services[serviceCursor++ % DATA.services.length] });
      }
    });
    return seq;
  }

  var seq = buildSequence();
  var idx = -1;
  var current = null;
  var timer = null;
  var paused = false;
  var startedAt = Date.now();

  function preload(entry) {
    if (entry && entry.kind === "doctor" && entry.item.hasPhoto) { var im = new Image(); im.src = entry.item.photo; }
  }

  function startBar() {
    bar.style.transition = "none";
    bar.style.transform = "scaleX(0)";
    void bar.offsetWidth;
    bar.style.transition = "transform " + CONFIG.seconds + "s linear";
    bar.style.transform = "scaleX(1)";
  }

  function show(i) {
    if (i >= seq.length) {
      if ((Date.now() - startedAt) / 36e5 >= CONFIG.reloadAfterHours) {
        fetch("/display/data.js?v=" + Date.now(), { cache: "no-store" })
          .then(function (r) { if (r.ok) location.reload(); })
          .catch(function () {});
      }
      seq = buildSequence();
      i = 0;
    }
    if (i < 0) i = seq.length - 1;
    idx = i;
    var entry = seq[idx];
    var el = document.createElement("section");
    el.className = "slide";
    el.innerHTML = entry.kind === "doctor" ? doctorHtml(entry.item) : serviceHtml(entry.item);
    stage.appendChild(el);
    void el.offsetWidth;
    el.className = "slide is-on";
    var old = current;
    current = el;
    if (old) setTimeout(function () { if (old.parentNode) old.parentNode.removeChild(old); }, 1000);
    preload(seq[idx + 1]);
    schedule();
  }

  function schedule() {
    clearTimeout(timer);
    if (paused) return;
    startBar();
    timer = setTimeout(function () { show(idx + 1); }, CONFIG.seconds * 1000);
  }

  /* ---------- orologio ---------- */
  var GIORNI = ["domenica", "lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato"];
  var MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];
  function tick() {
    var n = new Date();
    document.getElementById("clockTime").textContent = ("0" + n.getHours()).slice(-2) + ":" + ("0" + n.getMinutes()).slice(-2);
    document.getElementById("clockDate").textContent = GIORNI[n.getDay()] + " " + n.getDate() + " " + MESI[n.getMonth()];
  }

  /* ---------- comandi ---------- */
  function fullscreen() {
    var d = document.documentElement;
    var fn = d.requestFullscreen || d.webkitRequestFullscreen;
    if (fn && !(document.fullscreenElement || document.webkitFullscreenElement)) fn.call(d);
  }
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") show(idx + 1);
    else if (e.key === "ArrowLeft") show(idx - 1);
    else if (e.key === " " || e.key === "Enter" || e.key === "MediaPlayPause") {
      paused = !paused;
      document.body.classList.toggle("paused", paused);
      if (paused) { clearTimeout(timer); bar.style.transition = "none"; } else schedule();
    }
    else if (e.key === "f" || e.key === "F") fullscreen();
  });
  document.addEventListener("click", fullscreen);

  function keepAwake() {
    if (navigator.wakeLock && document.visibilityState === "visible") navigator.wakeLock.request("screen").catch(function () {});
  }
  document.addEventListener("visibilitychange", keepAwake);

  document.getElementById("generalQr").innerHTML = DATA.general.qr;
  tick();
  setInterval(tick, 10000);
  keepAwake();
  var startSlug = params.get("da");
  var start = 0;
  seq.forEach(function (e, i) { if (startSlug && e.kind === "doctor" && e.item.slug === startSlug) start = i; });
  show(start);
})();
</script>
</body>
</html>
